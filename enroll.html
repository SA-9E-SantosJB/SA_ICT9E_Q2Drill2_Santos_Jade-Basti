<div class="container my-4">
    <div class="block text-center">
      <div class="content-box">
        
      <h1 class="title mb-1">ENROLL</h1>
      <h5 class="second-title mb-4">A DIAMOND LEGACY OF LEARNING </h5>
      
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label for="firstName" class="form-label">First Name *</label>
          <input type="text" class="form-control" id="firstName" required>
        </div>
        <div class="col-md-4">
          <label for="middleName" class="form-label">Middle Name</label>
          <input type="text" class="form-control" id="middleName">
        </div>
        <div class="col-md-4">
          <label for="lastName" class="form-label">Last Name *</label>
          <input type="text" class="form-control" id="lastName" required>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label for="dob" class="form-label">Date of Birth *</label>
          <input type="date" class="form-control" id="dob" required>
        </div>
        <div class="col-md-4">
          <label for="gender" class="form-label">Gender *</label>
          <select class="form-select" id="gender" required>
            <option value="" selected disabled>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="gradeLevel" class="form-label">Grade Level Applying For *</label>
          <select class="form-select" id="gradeLevel" required>
            <option value="" selected disabled>Select Grade Level</option>
            <option value="Casa / Preschool">Casa / Preschool</option>
            <option value="Primary / Elementary">Primary / Elementary</option>
            <option value="Junior High School">Junior High School</option>
            <option value="Senior High School">Senior High School</option>
          </select>
        </div>
      </div>

      <h4 class="form-header">Parent / Guardian Information</h4>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="parentName" class="form-label">Full Name of Parent/Guardian *</label>
          <input type="text" class="form-control" id="parentName" required>
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">Email Address *</label>
          <input type="email" class="form-control" id="email" required>
        </div>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-custom btn-lg">Submit Application</button>
      </div>

      </div>
    </div>
  </div>
</div>
